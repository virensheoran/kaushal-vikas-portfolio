<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Value Chain poster">
  <rect width="800" height="600" fill="#eef2f9"/>
  <rect x="20" y="20" width="760" height="560" rx="20" fill="#ffffff" stroke="#dbe3f2"/>

  <text x="400" y="68" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" fill="#15803d" letter-spacing="2">VALUE CHAIN</text>
  <text x="400" y="94" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" fill="#5b6b86">From Raw Material to a Happy Customer</text>

  <!-- Support activities -->
  <text x="44" y="126" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="#8a6d1f" letter-spacing="1">SUPPORT ACTIVITIES</text>

  <rect x="44" y="140" width="167" height="74" rx="12" fill="#fffdf5" stroke="#e0cfa0"/>
  <text x="128" y="172" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#8a6d1f">Firm Infrastructure</text>
  <text x="128" y="192" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10.5" fill="#a08a4f">Planning &amp; management</text>

  <rect x="225" y="140" width="167" height="74" rx="12" fill="#fffdf5" stroke="#e0cfa0"/>
  <text x="309" y="172" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#8a6d1f">Human Resource</text>
  <text x="309" y="192" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10.5" fill="#a08a4f">Hiring &amp; training</text>

  <rect x="406" y="140" width="167" height="74" rx="12" fill="#fffdf5" stroke="#e0cfa0"/>
  <text x="490" y="172" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#8a6d1f">Technology</text>
  <text x="490" y="192" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10.5" fill="#a08a4f">Research &amp; design</text>

  <rect x="587" y="140" width="167" height="74" rx="12" fill="#fffdf5" stroke="#e0cfa0"/>
  <text x="671" y="172" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#8a6d1f">Procurement</text>
  <text x="671" y="192" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10.5" fill="#a08a4f">Buying materials</text>

  <!-- Primary activities -->
  <text x="44" y="246" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="#1e3a8a" letter-spacing="1">PRIMARY ACTIVITIES</text>

  <rect x="44" y="256" width="120" height="92" rx="12" fill="#eef3ff" stroke="#cdd9f5"/>
  <text x="104" y="296" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#1e3a8a">1. Inbound</text>
  <text x="104" y="316" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#5b6b86">Raw material in</text>

  <text x="178" y="310" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#2b50c9">→</text>

  <rect x="192" y="256" width="120" height="92" rx="12" fill="#eef3ff" stroke="#cdd9f5"/>
  <text x="252" y="296" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#1e3a8a">2. Operations</text>
  <text x="252" y="316" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#5b6b86">Making the product</text>

  <text x="326" y="310" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#2b50c9">→</text>

  <rect x="340" y="256" width="120" height="92" rx="12" fill="#eef3ff" stroke="#cdd9f5"/>
  <text x="400" y="296" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#1e3a8a">3. Outbound</text>
  <text x="400" y="316" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#5b6b86">Storage &amp; delivery</text>

  <text x="474" y="310" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#2b50c9">→</text>

  <rect x="488" y="256" width="120" height="92" rx="12" fill="#eef3ff" stroke="#cdd9f5"/>
  <text x="548" y="296" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#1e3a8a">4. Marketing</text>
  <text x="548" y="316" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#5b6b86">Advertising &amp; selling</text>

  <text x="622" y="310" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#2b50c9">→</text>

  <rect x="636" y="256" width="120" height="92" rx="12" fill="#eef3ff" stroke="#cdd9f5"/>
  <text x="696" y="296" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#1e3a8a">5. Service</text>
  <text x="696" y="316" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#5b6b86">After-sales help</text>

  <!-- Profit banner -->
  <rect x="44" y="372" width="712" height="52" rx="12" fill="#eaf7ee" stroke="#bfe3c9"/>
  <text x="400" y="404" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" fill="#15803d" letter-spacing="0.5">VALUE ADDED  →  CUSTOMER SATISFACTION  →  PROFIT</text>

  <!-- Example box -->
  <rect x="44" y="444" width="712" height="104" rx="12" fill="#f7f9ff" stroke="#dbe3f2"/>
  <text x="64" y="476" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#12203a">Example — A packet of biscuits:</text>
  <text x="64" y="500" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5b6b86">Wheat &amp; sugar  ➜  mixing &amp; baking  ➜  packing &amp; delivery  ➜  advertising  ➜  customer care</text>
  <text x="64" y="526" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5b6b86">Why it matters:  adds value  •  reduces cost  •  improves quality  •  builds customer trust</text>

  <text x="400" y="582" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" fill="#8695ad">Value Chain Poster  •  Viren Sheoran  •  Class 9-C</text>
</svg>
