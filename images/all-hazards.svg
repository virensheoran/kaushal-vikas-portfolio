<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="All Hazards poster">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#2b50c9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#eef2f9"/>
  <rect x="20" y="20" width="760" height="560" rx="20" fill="#ffffff" stroke="#dbe3f2"/>

  <!-- header -->
  <rect x="20" y="20" width="760" height="104" rx="20" fill="url(#hdr)"/>
  <text x="400" y="72" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="3">ALL HAZARDS</text>
  <text x="400" y="102" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#cdd9f5" letter-spacing="1">Be Aware  •  Be Prepared  •  Stay Safe</text>

  <!-- Row 1 -->
  <rect x="44" y="146" width="226" height="106" rx="14" fill="#f7f9ff" stroke="#dbe3f2"/>
  <text x="157" y="198" text-anchor="middle" font-family="Segoe UI Emoji,Segoe UI,Arial,sans-serif" font-size="30">🌊</text>
  <text x="157" y="228" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#12203a">Flood</text>

  <rect x="286" y="146" width="226" height="106" rx="14" fill="#f7f9ff" stroke="#dbe3f2"/>
  <text x="399" y="198" text-anchor="middle" font-family="Segoe UI Emoji,Segoe UI,Arial,sans-serif" font-size="30">🏚️</text>
  <text x="399" y="228" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#12203a">Earthquake</text>

  <rect x="528" y="146" width="226" height="106" rx="14" fill="#f7f9ff" stroke="#dbe3f2"/>
  <text x="641" y="198" text-anchor="middle" font-family="Segoe UI Emoji,Segoe UI,Arial,sans-serif" font-size="30">🔥</text>
  <text x="641" y="228" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#12203a">Fire</text>

  <!-- Row 2 -->
  <rect x="44" y="266" width="226" height="106" rx="14" fill="#f7f9ff" stroke="#dbe3f2"/>
  <text x="157" y="318" text-anchor="middle" font-family="Segoe UI Emoji,Segoe UI,Arial,sans-serif" font-size="30">☣️</text>
  <text x="157" y="348" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#12203a">Chemical</text>

  <rect x="286" y="266" width="226" height="106" rx="14" fill="#f7f9ff" stroke="#dbe3f2"/>
  <text x="399" y="318" text-anchor="middle" font-family="Segoe UI Emoji,Segoe UI,Arial,sans-serif" font-size="30">⚡</text>
  <text x="399" y="348" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#12203a">Electric Shock</text>

  <rect x="528" y="266" width="226" height="106" rx="14" fill="#f7f9ff" stroke="#dbe3f2"/>
  <text x="641" y="318" text-anchor="middle" font-family="Segoe UI Emoji,Segoe UI,Arial,sans-serif" font-size="30">🚧</text>
  <text x="641" y="348" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#12203a">Road Accident</text>

  <!-- Row 3 -->
  <rect x="44" y="386" width="226" height="106" rx="14" fill="#f7f9ff" stroke="#dbe3f2"/>
  <text x="157" y="438" text-anchor="middle" font-family="Segoe UI Emoji,Segoe UI,Arial,sans-serif" font-size="30">🌪️</text>
  <text x="157" y="468" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#12203a">Storm / Cyclone</text>

  <rect x="286" y="386" width="226" height="106" rx="14" fill="#f7f9ff" stroke="#dbe3f2"/>
  <text x="399" y="438" text-anchor="middle" font-family="Segoe UI Emoji,Segoe UI,Arial,sans-serif" font-size="30">☀️</text>
  <text x="399" y="468" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#12203a">Heat Wave</text>

  <rect x="528" y="386" width="226" height="106" rx="14" fill="#f7f9ff" stroke="#dbe3f2"/>
  <text x="641" y="438" text-anchor="middle" font-family="Segoe UI Emoji,Segoe UI,Arial,sans-serif" font-size="30">💻</text>
  <text x="641" y="468" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#12203a">Cyber Crime</text>

  <!-- emergency strip -->
  <rect x="44" y="510" width="712" height="48" rx="12" fill="#eaf7ee" stroke="#bfe3c9"/>
  <text x="400" y="540" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#15803d">🚨 Emergency (India):  112  •  Fire 101  •  Ambulance 108  •  Police 100</text>

  <text x="400" y="582" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" fill="#8695ad">Kaushal Vikas Project  •  Viren Sheoran  •  Class 9-C</text>
</svg>
